name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Deny all permissions by default; each job grants only what it needs.
permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check agent_memory/ mcp_server/ tests/

      - name: Type check (mypy, enforced)
        run: mypy agent_memory/ mcp_server/

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  test-semantic:
    # Exercises the optional sqlite-vec + fastembed vector-search path.
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies with semantic extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,semantic]"

      - name: Run full test suite with embeddings active
        run: python -m pytest tests/ -v --tb=short

  test-redis:
    # Exercises the optional Redis backend: CRUD / BM25 via fakeredis, and the
    # RedisVSS vector path against a real Redis 8 (which bundles RediSearch).
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies with Redis + semantic extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,redis,semantic]"
          pip install fakeredis

      - name: Run Redis backend tests
        env:
          # Must be db 0 — RediSearch cannot index any other database.
          AGENT_MEMORY_TEST_REDIS_URL: "redis://localhost:6379/0"
        run: python -m pytest tests/test_redis_store.py -v --tb=short

  test-api:
    # Exercises the optional FastAPI REST server.
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies with API extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"

      - name: Run API server tests
        run: python -m pytest tests/test_api.py -v --tb=short

  test-postgres:
    # Exercises the optional Postgres backend with a real server, including the
    # pgvector HNSW KNN path (hence the pgvector image, not stock postgres).
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_memory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies with Postgres + pgvector + semantic extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres,pgvector,semantic]"

      - name: Run Postgres backend tests
        env:
          AGENT_MEMORY_POSTGRES_DSN: "postgresql://postgres:postgres@localhost/agent_memory_test"
        run: |
          python -m pytest \
            tests/test_postgres_store.py \
            tests/test_postgres_identifier.py \
            -v --tb=short

  test-qdrant:
    # Exercises the Qdrant backend against a real server: HNSW KNN, full-text
    # BM25, and the server-side scope / TTL payload filters.
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies with Qdrant extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,qdrant,semantic]"

      - name: Wait for Qdrant
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:6333/readyz > /dev/null && exit 0
            sleep 2
          done
          echo "Qdrant did not become ready" >&2
          exit 1

      - name: Run Qdrant backend tests
        env:
          AGENT_MEMORY_TEST_QDRANT_URL: "http://localhost:6333"
        run: python -m pytest tests/test_qdrant_store.py -v --tb=short

  test-features:
    # Tests for graph, confidence, multi-agent, benchmarks, and adapters.
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run feature tests (graph, confidence, multi-agent, benchmarks, adapters)
        run: |
          python -m pytest \
            tests/test_graph.py \
            tests/test_confidence.py \
            tests/test_multiagent.py \
            tests/test_benchmarks.py \
            tests/test_adapters.py \
            -v --tb=short

  test-langchain:
    # LangChain adapter integration tests.
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies with LangChain extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,langchain]"

      - name: Run LangChain adapter tests
        run: python -m pytest tests/test_adapters.py -v --tb=short -k "langchain"

  eval:
    # Decision-quality evaluation over all datasets, including trap cases.
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run evaluation datasets
        run: agent-memory --data-dir /tmp/eval-mem eval

      - name: Run benchmark
        run: agent-memory --data-dir /tmp/bench-mem benchmark --seed --repeat 3

  docker:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          # Generate a valid PEP 440 version
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF_NAME#v}
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            VERSION="0.0.0.dev0+$(git rev-parse --short HEAD)"
          else
            BRANCH=$(echo "${GITHUB_REF_NAME}" | sed 's/[^a-zA-Z0-9]/-/g')
            VERSION="0.0.0.dev0+${BRANCH}.$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=${VERSION}"
          docker build --build-arg VERSION="${VERSION}" -t agent-memory:latest .

      - name: Test Docker image with SQLite backend
        run: |
          docker run --rm agent-memory:latest --help
          docker run --rm -v agent_memory_data:/home/appuser/.agent_memory agent-memory:latest remember "test" "test response"
          docker run --rm -v agent_memory_data:/home/appuser/.agent_memory agent-memory:latest resolve "test"

      - name: Test Docker image with ChromaDB backend
        run: |
          docker run --rm -v agent_memory_chromadb:/home/appuser/.agent_memory agent-memory:latest remember "test" "test response" --backend chromadb
          docker run --rm -v agent_memory_chromadb:/home/appuser/.agent_memory agent-memory:latest resolve "test" --backend chromadb
