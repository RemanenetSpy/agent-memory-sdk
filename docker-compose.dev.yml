# docker-compose.dev.yml
#
# Development infrastructure: Redis + PostgreSQL + Qdrant
#
# Start all services:   docker compose -f docker-compose.dev.yml up -d
# Stop + wipe volumes:  docker compose -f docker-compose.dev.yml down -v
#
# Every image here ships the vector index its backend wants, so semantic search
# works out of the box: Redis 8 bundles the query engine (RediSearch), the
# postgres service uses the pgvector image, and Qdrant is vector-native.
#
# After starting, point the SDK at the services via env vars:
#
#   AGENT_MEMORY_BACKEND=redis
#   AGENT_MEMORY_REDIS_URL=redis://localhost:6379/0
#
#   AGENT_MEMORY_BACKEND=postgres
#   AGENT_MEMORY_POSTGRES_DSN=postgresql://agent_memory:agent_memory@localhost:5432/agent_memory
#
#   AGENT_MEMORY_BACKEND=qdrant
#   AGENT_MEMORY_QDRANT_URL=http://localhost:6333
#
# See .env.example for the full variable reference.

services:

  # --------------------------------------------------------------------------
  # Redis – used by the Redis memory backend
  #
  # redis:8 bundles RediSearch in the core image, which is what the backend's
  # HNSW vector index needs. On Redis 7 or plain OSS builds the backend still
  # works, but search() silently degrades to BM25.
  # --------------------------------------------------------------------------
  redis:
    image: redis:8-alpine
    container_name: agent_memory_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
        --appendonly yes
        --maxmemory ${REDIS_MAX_MEMORY:-256mb}
        --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # PostgreSQL – used by the Postgres memory backend
  #
  # The pgvector image is a drop-in superset of the official postgres image; it
  # just also carries the `vector` extension, so the backend can build its HNSW
  # KNN index instead of falling back to keyword-only search.
  # --------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agent_memory_postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent_memory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_memory}
      POSTGRES_DB: ${POSTGRES_DB:-agent_memory}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent_memory}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Qdrant – used by the Qdrant memory backend
  # 6333 serves REST (and the dashboard at /dashboard), 6334 serves gRPC.
  # --------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: agent_memory_qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  qdrant_data:
