[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "agent-memory-sdk"
description = "Persistent semantic memory for AI agents with replay, restore, verify, and ignore decisions"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "TheProdSDE", email = "theprodsde@gmail.com" }]
keywords = [
    "ai-agents",
    "memory",
    "llm",
    "rag",
    "retrieval",
    "mcp",
    "semantic-search",
    "agent-memory",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "rank-bm25>=0.2.2",
    "chromadb>=0.5.0",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/TheProdSDE/agent-memory-sdk"
Repository = "https://github.com/TheProdSDE/agent-memory-sdk"
Issues = "https://github.com/TheProdSDE/agent-memory-sdk/issues"
Changelog = "https://github.com/TheProdSDE/agent-memory-sdk/blob/main/CHANGELOG.md"

[project.optional-dependencies]
semantic = [
    "sqlite-vec>=0.1.6",
    "fastembed>=0.3.0",
]
redis = [
    "redis>=5.0.0",
]
postgres = [
    "psycopg2-binary>=2.9.0",
]
pgvector = [
    "pgvector>=0.2.0",
]
qdrant = [
    # 1.12 is the first release with query_points() and facet().
    "qdrant-client>=1.12.0",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
]
langchain = [
    "langchain-core>=0.2.0",
]
llamaindex = [
    "llama-index-core>=0.10.0",
]
dashboard = [
    "streamlit>=1.35.0",
    "altair>=5.0.0",
    "pandas>=2.0.0",
]
charts = [
    # Only needed to regenerate benchmark charts (make stress-charts).
    "matplotlib>=3.8.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "black>=24.0.0",
    "fakeredis>=2.20.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "qdrant-client>=1.12.0",
]

[project.scripts]
agent-memory = "agent_memory.cli:main"
agent-memory-mcp = "mcp_server.server:main"
# Alias matching the PyPI package name so `uvx agent-memory-sdk` starts the
# MCP server directly (the MCP registry's default launch convention).
agent-memory-sdk = "mcp_server.server:main"
agent-memory-api = "agent_memory.api.server:main"
agent-memory-dashboard = "agent_memory.dashboard.launcher:main"

[tool.hatch.build.targets.wheel]
packages = ["agent_memory", "mcp_server"]

# Include the new sub-packages explicitly so hatch picks them up
include = ["agent_memory/**"]

[tool.hatch.version]
source = "vcs"
version-file = "agent_memory/_version.py"

[tool.hatch.build.hooks.vcs]
version-file = "agent_memory/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# Third-party libraries without stubs (or with stubs that need newer Python).
module = [
    "chromadb.*",
    "rank_bm25.*",
    "sqlite_vec.*",
    "fastembed.*",
    "sentence_transformers.*",
    "mcp.*",
    "redis.*",
    "fakeredis.*",
    "psycopg2.*",
    "pgvector.*",
    "qdrant_client.*",
    "fastapi.*",
    "uvicorn.*",
    "httpx.*",
    "starlette.*",
    "langchain.*",
    "langchain_core.*",
    "llama_index.*",
    "streamlit.*",
    "altair.*",
    "pandas.*",
    "spacy.*",
]
ignore_missing_imports = true
follow_imports = "skip"
